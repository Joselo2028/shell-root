<tk-header
  [loggedIn]="isLoggedIn()"
  [loginLabel]="isStartingLogin() ? 'Espere...' : 'Iniciar Sesión'"
  registerLabel="Registrarse"
  (login)="startLogin()"
>
</tk-header>
@if (isLoggedIn()) {
  <button
    type="button"
    style="position: absolute; top: 0; right: 0"
    background-color="green"
    (click)="goToLegacy()"
  >
    Ir a Legacy
  </button>
}
